name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-for-ci-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci
          STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_build
          STRIPE_WEBHOOK_SECRET: whsec_placeholder_for_ci_build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
